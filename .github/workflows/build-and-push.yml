name: Build and push image

# Builds the worker image (see Dockerfile) and pushes it to Docker Hub.
# GKE's node pools are linux/amd64 (see k8s/README.md), so this builds for
# that platform only - no QEMU emulation needed since GitHub's runners are
# amd64 already.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME - Docker Hub username with push access to the image below
#   DOCKERHUB_TOKEN     - a Docker Hub access token (not your account password)
#
# After a run completes, copy the "image@sha256:..." digest from the job
# summary into k8s/deployment.yaml's `image:` field, then
# `kubectl apply -f k8s/` (or rollout restart) to deploy it.

on:
  push:
    branches: [main]
    paths:
      - "gong_agent/**"
      - "worker.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  IMAGE: cremerfc/ai-agent-gongy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Record digest
        run: |
          {
            echo "### Image pushed"
            echo
            echo '```'
            echo "${IMAGE}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Update \`k8s/deployment.yaml\`'s \`image:\` field to this value, then \`kubectl apply -f k8s/\`."
          } >> "$GITHUB_STEP_SUMMARY"
